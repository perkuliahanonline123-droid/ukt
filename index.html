<!DOCTYPE html>
<html lang="id">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Pembayaran Kuliah - Portal Keuangan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* HERO BANNER */
        .hero-banner {
            width: 100%;
            max-width: 860px;
            background: linear-gradient(135deg, #1e1b4b 0%, #31106a 50%, #3b0764 100%);
            border-radius: 24px;
            padding: 45px 30px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 25px -5px rgba(30, 27, 75, 0.15);
            margin-bottom: 24px;
        }

        .badge-portal {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 30px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .hero-banner h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-banner p {
            font-size: 15px;
            color: #cbd5e1;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* KARTU BATAS AKHIR */
        .deadline-container {
            width: 100%;
            max-width: 860px;
            background: #fffcf0;
            border: 1px solid #fef08a;
            border-radius: 18px;
            padding: 16px 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        .deadline-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .deadline-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
        }

        .icon-orange { background-color: #f59e0b; color: white; }
        .icon-purple { background-color: #4f46e5; color: white; }

        .deadline-text span {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .deadline-text strong {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }

        /* WADAH UTAMA */
        .main-card {
            width: 100%;
            max-width: 860px;
            background: white;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            border: 1px solid #f1f5f9;
        }

        /* INPUT AUTOCOMPLETE BOX */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            border: 1.5px solid #4f46e5;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            outline: none;
            transition: all 0.2s;
            background: #fafaf9;
        }

        .search-box input:focus {
            background: white;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }

        /* DROPDOWN SARAN (AUTOCOMPLETE) */
        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            margin-top: 6px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            z-index: 50;
            display: none;
        }

        .suggestion-item {
            padding: 12px 18px;
            font-size: 14px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }

        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #f8fafc; color: #4f46e5; }
        
        .suggestion-item .hint-click {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        button.btn-cari {
            width: 100%;
            background-color: #0d9488;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 24px;
        }

        button.btn-cari:hover { background-color: #0f766e; }
        button.btn-cari:disabled { background-color: #94a3b8; cursor: not-allowed; }

        /* KARTU HASIL */
        .result-card {
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            background: #ffffff;
            transition: transform 0.2s;
        }

        .result-card:hover { border-color: #cbd5e1; }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        .student-name {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-valid { background-color: #dcfce7; color: #15803d; }
        .badge-proses { background-color: #fef3c7; color: #b45309; }
        .badge-invalid { background-color: #fee2e2; color: #b91c1c; }

        .detail-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            font-size: 14px;
        }

        .detail-item span {
            display: block;
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .detail-item strong {
            color: #1e293b;
            font-weight: 600;
            font-size: 15px;
        }

        .text-proses {
            color: #d97706;
            background: #fef3c7;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .loading, .error-msg {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .error-msg {
            color: #dc2626;
            background: #fef2f2;
            border-radius: 12px;
            border: 1px solid #fee2e2;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }

        @media (max-width: 640px) {
            .deadline-container { grid-template-columns: 1fr; gap: 14px; }
            .hero-banner h1 { font-size: 26px; }
            .detail-row { grid-template-columns: 1fr; }
            .result-header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="hero-banner">
        <div class="badge-portal">PORTAL KEUANGAN</div>
        <h1>Cek Pembayaran Kuliah</h1>
        <p>Silakan ketik Nama Lengkap Anda untuk mengecek status pembayaran biaya kuliah secara real-time.</p>
    </div>

    <div class="deadline-container">
        <div class="deadline-box">
            <div class="deadline-icon icon-orange">📅</div>
            <div class="deadline-text">
                <span>BATAS AKHIR TAHAP 1</span>
                <strong>31 Juli 2026</strong>
            </div>
        </div>
        <div class="deadline-box">
            <div class="deadline-icon icon-purple">🗓️</div>
            <div class="deadline-text">
                <span>BATAS AKHIR TAHAP 2</span>
                <strong>25 Agustus 2026</strong>
            </div>
        </div>
    </div>

    <div class="main-card">
        <div class="search-box">
            <input type="text" id="namaCari" placeholder="Masukkan nama lengkap (min. 3 huruf)..." autocomplete="off">
            <!-- WADAH DROPDOWN AUTOCOMPLETE -->
            <div id="suggestions" class="suggestions-list"></div>
        </div>
        
        <button onclick="cariData()" id="btnCari" class="btn-cari">Cari Data Pembayaran</button>

        <div id="hasil"></div>
    </div>

    <footer>
        &copy; 2026 Abdul Hakim, S.H., M.A. — Layanan Administrasi Akademik
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypD_evDfABwwvCoHPSkAxjxDL1lQ4MkC10mWs8fY1LV5CS2p3Mrlu4WEZ3voQTLS654A/exec";
        const CACHE_KEY = "database_ukt_2026";
        const CACHE_TIME_KEY = "database_ukt_time";
        const CACHE_DURATION = 5 * 60 * 1000; // Cache berlaku 5 menit

        let databasePembayaran = [];

        // 1. OTOMATIS LOAD & CACHE DATABASE SAAT HALAMAN DIBUKA
        document.addEventListener("DOMContentLoaded", () => {
            muatDatabaseCache();

            const inputNama = document.getElementById("namaCari");
            const suggestionBox = document.getElementById("suggestions");

            // Event saat mengetik 3 huruf -> Muncul Suggestion
            inputNama.addEventListener("input", function() {
                const query = this.value.trim().toLowerCase();
                suggestionBox.innerHTML = "";

                if (query.length >= 3 && databasePembayaran.length > 0) {
                    const hasilFilter = databasePembayaran.filter(item => 
                        item.nama.toLowerCase().includes(query)
                    ).slice(0, 6); // Maksimal tampilkan 6 nama rekomendasi

                    if (hasilFilter.length > 0) {
                        hasilFilter.forEach(item => {
                            const div = document.createElement("div");
                            div.className = "suggestion-item";
                            div.innerHTML = `<span>${item.nama}</span> <span class="hint-click">Klik untuk lihat</span>`;
                            div.onclick = () => {
                                inputNama.value = item.nama;
                                suggestionBox.style.display = "none";
                                tampilkanHasil([item]); // Langsung tampilkan hasil tanpa klik tombol cari lagi
                            };
                            suggestionBox.appendChild(div);
                        });
                        suggestionBox.style.display = "block";
                        return;
                    }
                }
                suggestionBox.style.display = "none";
            });

            // Tutup dropdown jika klik di luar area input
            document.addEventListener("click", function(e) {
                if (e.target !== inputNama) {
                    suggestionBox.style.display = "none";
                }
            });

            // Enter untuk pencarian
            inputNama.addEventListener("keydown", function(e) {
                if (e.key === "Enter") {
                    suggestionBox.style.display = "none";
                    cariData();
                }
            });
        });

        // 2. FUNGSI MANAJEMEN CACHE
        function muatDatabaseCache() {
            const cachedData = sessionStorage.getItem(CACHE_KEY);
            const cachedTime = sessionStorage.getItem(CACHE_TIME_KEY);
            const now = new Date().getTime();

            // Jika cache ada dan belum kadaluarsa (5 menit), gunakan cache
            if (cachedData && cachedTime && (now - cachedTime < CACHE_DURATION)) {
                databasePembayaran = JSON.parse(cachedData);
                return;
            }

            // Jika belum ada cache, unduh dari Apps Script secara background
            fetch(SCRIPT_URL + "?action=all")
                .then(res => res.json())
                .then(data => {
                    if (Array.isArray(data) && !data[0]?.error) {
                        databasePembayaran = data;
                        sessionStorage.setItem(CACHE_KEY, JSON.stringify(data));
                        sessionStorage.setItem(CACHE_TIME_KEY, now);
                    }
                })
                .catch(err => console.error("Gagal menyinkronkan database cache:", err));
        }

        // 3. FUNGSI TOMBOL CARI (Bisa dari cache atau fetch server)
        function cariData() {
            var nama = document.getElementById("namaCari").value.trim();
            var hasilDiv = document.getElementById("hasil");
            var btnCari = document.getElementById("btnCari");

            if (nama.length < 3) {
                hasilDiv.innerHTML = '<div class="error-msg">Silakan masukkan minimal 3 huruf nama Anda.</div>';
                return;
            }

            // Cek terlebih dahulu di Cache Browser (sangat cepat)
            if (databasePembayaran.length > 0) {
                const hasilCache = databasePembayaran.filter(item => 
                    item.nama.toLowerCase().includes(nama.toLowerCase())
                );
                if (hasilCache.length > 0) {
                    tampilkanHasil(hasilCache);
                    return;
                }
            }

            // Jika tidak ketemu di cache, lakukan fetch ke server
            hasilDiv.innerHTML = '<p class="loading">⏳ Menelusuri database pembayaran... Mohon tunggu.</p>';
            btnCari.disabled = true;

            fetch(SCRIPT_URL + "?nama=" + encodeURIComponent(nama))
                .then(response => response.json()) 
                .then(data => {
                    btnCari.disabled = false;
                    tampilkanHasil(data);
                })
                .catch(error => {
                    btnCari.disabled = false;
                    hasilDiv.innerHTML = '<div class="error-msg">Gagal terhubung ke server. Periksa koneksi internet Anda.</div>';
                    console.error('Error fetching data:', error);
                });
        }

        // 4. RENDER KARTU HASIL
        function tampilkanHasil(data) {
            var hasilDiv = document.getElementById("hasil");
            hasilDiv.innerHTML = "";

            if (data.length > 0 && data[0].error) {
                hasilDiv.innerHTML = '<div class="error-msg">' + data[0].pesan + '</div>';
                return;
            }

            if (!data || data.length === 0) {
                hasilDiv.innerHTML = '<div class="error-msg">Data tidak ditemukan. Pastikan nama yang dicari sudah sesuai dengan yang terdaftar.</div>';
                return;
            }

            var html = "";
            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var statusBadge = "";
                var ketLowerCase = (item.keterangan || "").toLowerCase();
                
                if (ketLowerCase.includes("tidak valid") || ketLowerCase.includes("tolak") || ketLowerCase.includes("revisi")) {
                    statusBadge = `<span class="status-badge badge-invalid">✕ ${item.keterangan}</span>`;
                } else if (ketLowerCase.includes("valid") || ketLowerCase.includes("terverifikasi") || ketLowerCase.includes("lunas")) {
                    statusBadge = `<span class="status-badge badge-valid">✓ ${item.keterangan}</span>`;
                } else {
                    statusBadge = `<span class="status-badge badge-proses">⏳ ${item.keterangan}</span>`;
                }

                let tglDisplay = (item.tanggal === "Proses" || item.tanggal === "" || item.tanggal === "-") ? '<span class="text-proses">Proses</span>' : item.tanggal;
                let nomDisplay = (item.nominal === "Proses" || item.nominal === "" || item.nominal === "-") ? '<span class="text-proses">Proses</span>' : item.nominal;

                html += `
                <div class="result-card">
                    <div class="result-header">
                        <div class="student-name">${item.nama}</div>
                        <div>${statusBadge}</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-item">
                            <span>NOMINAL PEMBAYARAN</span>
                            <strong>${nomDisplay}</strong>
                        </div>
                        <div class="detail-item">
                            <span>TANGGAL PEMBAYARAN</span>
                            <strong>${tglDisplay}</strong>
                        </div>
                    </div>
                </div>`;
            }

            hasilDiv.innerHTML = html;
        }
    </script>
</body>
</html>
